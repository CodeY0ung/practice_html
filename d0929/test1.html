<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 600px;
            height: 400px;
            border: solid 2px;
            box-sizing: border-box;
        }
        .item{
            width: 100px;
            height: 100px;
            /* position: relative; */
            position: absolute;
            border: solid 1px;
            box-sizing: border-box;
        }
        .blue{
            background-color: blue;
        }
        .red{
            background-color: red;

            left: 500px;
            /* bottom: 100px;
            left: 500px; */
        }
        .yellow{
            background-color: yellow;
            top: 300px;
            /* top: 100px; */
        }
        .green{
            background-color: green;
            left: 500px;
            top: 300px;
            /* left: 500px; */
        }
        body{
            margin: 0px;
        }
    </style>

</head>
<body>
    <!-- id:container size : 600,400, 테두리 두께 : 2px -->
     <!-- class : item, size : 100,100 -->
     <div id="container">
        <div class="item blue">1</div>
        <div class="item red">2</div>
        <div class="item yellow">3</div>
        <div class="item green">4</div>
     </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main h3{
            border-left: solid 8px orange;
            padding-left: 20px;
        }

        #main p{
            line-height: 180%;
        }

        #main span{
            font-weight: bold;
        }

        #intro{
            border: solid 1px green;
            padding: 20px;
            margin-top: 30px;
            border-radius: 15px;
        }

        #intro h3{
            border-bottom: dotted 1px black;
            padding-bottom: 5px;
        }

        #intro span{
            font-weight: bold;
            color: red;
        }

    </style>
</head>
<body>
    <!-- 봄빛 식물원
            봄빛 식물원은 울창한 숲으로 둘러싸인 ㅅ마각산 자락에 위치하고 있으며, 2000종의 다양한 식물이 전시되고있습니다.
            식물원 관람 안내
            - 방문 1일전날까지 인터넷으로 예약해야 합니다.
            - 입장료 : 10,000원
            - 동절기인 12월1일부터는 15:00에 폐장합니다.
            식물원 이용 시간
            - 야외 식물원: 9:00~19:00
            - 온실 식물원: 9:00~17:00
            - 문의전화: 031-123-1234
            # 일과 시간 외에는 홈페이지 게시판에 문의해 주세요.-->

    <header id="main">
        <h3>봄빛 식물원</h3>
        <p>봄빛 식물원은 울창한 숲으로 둘러싸인 <span>삼각산 자락에 위치</span>하고 있으며, 2000종의 다양한 식물이 전시되고있습니다.</p>
    </header>

    <div id="intro">
        <h3>식물원 관람 안내</h3>
        <p>
            - 방문 1일전날까지 인터넷으로 예약해야 합니다.<br>
            - 입장료 : 10,000원<br>
            - 동절기인 <span>12월1일부터는 15:00에 폐장합니다.</span><br>
        </p>
        <h3>식물원 이용 시간</h3>
        <p>
            - 야외 식물원: 9:00~19:00<br>
            - 온실 식물원: 9:00~17:00<br>
            - 문의전화: 031-123-1234<br>
            - <span>일과 시간 외에는 홈페이지 게시판</span>에 문의해 주세요.<br>
        </p>
    </div>
</body>
</html>

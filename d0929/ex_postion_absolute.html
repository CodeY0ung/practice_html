<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            position : absolute;
            display: inline;
            background-color: brown;
            width: 300px;
            top: 20px;
        }
        span{
            position: absolute;
            display: block;
            background-color: aquamarine;
            width: 200px;
            top: 100px;
        }
    </style>
</head>
<body>
    <div>
        display : inline 이지만 absolute라서 width, height 지정 가능
    </div>

    <span>
        원래 인라인이지만 absolute라서 이미 블록처럼 동작
    </span>
</body>
</html>

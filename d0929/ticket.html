<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
        
            margin: 0;
        }
        h2{
            border-bottom: solid 2px orange;
        }
        .gray{
            background-color: lightcyan;
        }
        table, th, td{
            border: solid 1px black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h2>
        놀이공원 이용권
    </h2>
    <table style="border: solid 1px black;">
        <tr class="gray">
            <th>종류</th>
            <th>대인</th>
            <th>소인</th>
            <th>비고</th>
        </tr>
        <tr>
            <th>주간권</th>
            <td>20,000원</td>
            <td>10,000원</td>
            <td rowspan="3">공원 입장 및 놀이시설 이용 
                <br>(일부 놀이 기구 별도 요금)</td>
        </tr>
        <tr>
            <th>야간권</th>
            <td>15,000원</td>
            <td>8,000원</td>
        </tr>
        <tr>
            <th>2일권</th>
            <td>30,000원</td>
            <td>15,000원</td>
        </tr>
    </table>
</body>
</html>

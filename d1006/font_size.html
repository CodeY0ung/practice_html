<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 20px;
        }
        #p1{
            font-size: 3rem;
        }
        #p1+p{
            font-size: 1.5em;
        }
        #p1+p>span{
            font-size: 2em;
        }
    </style>
</head>
<body style="font-size: 30px;">
    <h3>폰트 크기가 가장 큰 텍스트는 무엇일까요?</h3>
    <hr>
    <p id="p1">hello1</p>
    <p>hello2 <span>James</span></p>
    <p style="font-size: 16px;">hello3</p>
    <p>hello4</p>
</body>
</html>

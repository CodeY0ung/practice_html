<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>

    
        .title-cell{
            width: 80px;
        }
        .login-button{
            padding: 22px;
            margin-left: 3px;
            
        }
        .login-text{
            width: 150px;
            height: 25px;
        }
    </style>
</head>
<body>

    <form action="">
        <table>
        <tr>
            <td class="title-cell">아이디</td>

            <td rowspan="2"><input type="submit" value="로그인" class="login-button"></td>
        </tr>
        <tr>
            <td class="title-cell cell">비밀번호</td>

        </tr>
        </table>
    </form>

</html>

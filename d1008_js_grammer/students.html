<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    const students = [
        {id:1, name:"name1", gender:"female", score:70},
        {id:2, name:"name2", gender:"female", score:50},
        {id:3, name:"name3", gender:"male", score:70},
        {id:4, name:"name4", gender:"male", score:70},
        {id:5, name:"name5", gender:"male", score:50},
    ]


    console.log(getTotal(students));
    // reduce 누적값으로 합계를 구함.
    const total = students.reduce((acc,st)=>{return acc+st.score},0);
    console.log(total);
    getMFNumber(students);
    console.log(addPass(students));
    // filter 기존 배열에 조건을 줘서 새 배열을 만들 수 있다.
    const passStudents = students.filter((st)=>{return st.score >= 60});
    const nonPassStudents = students.filter((st)=>{return st.score<60});
    console.log(passStudents);
    console.log(nonPassStudents);
    // map 기존 배열로 새 배열을 만든다. 
    const newStudents = students.map((st)=>{
        return {
            id : st.id,
            name : st.name,
            gender : st.gender,
            score : st.score + 10
        }
    });
    console.log(newStudents);

    function getTotal(students){
        let total = 0;

        for(const st of students){
            total += st.score;
        }

        return total;
    }

    function getMFNumber(students){
        let male = 0;
        let female = 0;
        
        for(const st of students){
            if(st.gender==="male"){
                male ++;
            }
            else{
                female ++;
            }
        }
        console.log(`남학생 수 : ${male}, 여학생수 : ${female}`)
    }

    function addPass(students){
       
        for(const st of students){
            if(st.score>=60){
                st.isPass = true;
            }
            else{
                st.isPass = false;
            }
        }

        return students;
    }
</script>
</html>

{학생 : 번호, 이름, 성별, 점수}, 
 학생 객체 5개(남3,여2), 
 60점 미만인 학생 2명, 
 학생 배열, 
 --- 함수 ---
 학생들 총점, reduce 함수 사용
 남/여 수, 
 함격여부 속성 추가
 합격자, 불합격자 배열 생성, filter 함수 사용
 map을 사용해서 학생들의 점수를 10점씩 올려라.
 -->

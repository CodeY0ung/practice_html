<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 가상의 비동기 api 요청 함수(2초 지연 시뮬레이션)
        const fetchItem = (id) =>{
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    resolve(`아이템 ${id} 정보`);
                }, 2000);
            });
        };

        // 비동기 제너레이터 함수(async와 function* 조합)
        async function* fetchSequenceItem(ids) {
            for(const id of ids){
                //await를 사용하여 비동기 데이터가 올 때까지 일시 정지
                const data = await fetchItem(id);
                yield data; // 데이터를 받아오면 반환하고 멈춤
            }
        }

        // 사용 예시 (for await ... of 문 사용)
        async function run() {
            const itemIds = [101,102,103];

            for await(const item of fetchSequenceItem(itemIds)){
                console.log(item);
            }
        }

        run();
    </script>
</body>
</html>

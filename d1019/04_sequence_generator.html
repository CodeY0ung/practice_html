<body>
    <script>
        let num = 1;
        function* sequence(){
            while(true){
                yield num++;
            }
        }

        const seq = sequence();
        console.log(seq.next());
        console.log(seq.next());
        console.log(seq.next());
        console.log(seq.next());
        console.log(seq.next());
        console.log(seq.next());
        console.log(seq.next());
    </script>

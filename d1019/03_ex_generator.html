<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Generator 함수</h1>
    <p>함수의 실행을 일시 정지하고 재개할 수 있다.</p>
    <p>제네레이터 함수를 호출하면 함수 코드가 바로 실행되는 대신 제너레이터(이터레이터) 객체가 반환된다.</p>
    <p>yield : 함수를 멈추고 값을 반환한다. next : 함수가 호출될 때마다 다음 yield지점까지 실행된다.</p>
    <script>
        // 제너레이터 함수 선언 - function 뒤에 '*'를 붙인다.
        function* numberGenerator(){
            yield 1;
            yield 2;
            yield 3;
        }

        // 제너레이터 객체 생성 - 일반적인 함수 실행과 다르다. 객체 생성이다.
        const gen = numberGenerator();

        console.log(gen.next()); // {value: 1, done: false}
        console.log(gen.next()); // {value: 2, done: false}
        console.log(gen.next()); // {value: 3, done: false}
        console.log(gen.next()); // {value: undefined, done: true}
    </script>
</body>
</html>

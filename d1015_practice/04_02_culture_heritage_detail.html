<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이우영_상세</title>
    <style>
        table, th, td{
            border: solid 1px black;
            border-collapse: collapse;
        }
        table{
            width: 98vw;
        }
        img{
            width: 100%;
            height: 700px;
        }
    </style>
</head>
<body>

    <table>
        <tbody id="demo">
            <tr>
                <th>사진</th>
                <td id="img"></td>
            </tr>
            <tr>
                <th>번호</th>
                <td id="no"></td>
            </tr>
            <tr>
                <th>이름</th>
                <td id="name"></td>
            </tr>
            <tr>
                <th>내용</th>
                <td id="content"></td>
            </tr>
        </tbody>
    </table>
</body>
<script>
    const params = new URLSearchParams(window.location.search);

    const no = document.querySelector("#no");
    no.textContent = `${params.get('no')}`;
    const name = document.querySelector("#name");
    name.textContent = `${params.get('name')}`;
    const content = document.querySelector("#content");
    content.textContent = `${params.get('content')}`;
    const img = document.querySelector("#img");
    img.innerHTML = `<img src="${params.get('img')}" alt="">`;
</script>
</html>

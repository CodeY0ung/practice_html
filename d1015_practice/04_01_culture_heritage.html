<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이우영</title>
    <style>
        table, th, td{
            border: solid 1px black;
            border-collapse: collapse;
        }
        table{
            width: 100vw;
        }
        img{
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>문화재</h1>
    <hr>

    <table>
        <tbody id="demo">
            <tr>
                <th>사진</th>
                <th>지정번호 (세부)</th>
                <th>명칭</th>
            </tr>
        </tbody>
    </table>
    <button type="button"id="btn">button</button>
    <button onclick="loadDoc()">onclick="loadDoc()"</button>
</body>
<script>
    const btn = document.querySelector("#btn");
    btn.addEventListener("click",function(){
        loadDoc();
    })

    function loadDoc(){
        console.log("start....")
        const xhttp = new XMLHttpRequest();

        // target 설정
        // 이 target으로 get 요청 보낼거야!
        xhttp.open("GET","http://apis.data.go.kr/6480000/gyeongnamcultural/gyeongnamculturallist?serviceKey=9e92ee95bc0359dec6e248a46a38d3d9a465b520f32a26f370226b1661484472&numOfRows=10&pageNo=1&resultType=json",false); // false는 동기방식. true 동기방식이 기본값임.

        // 처리 설정
        // 보내고 응답이 오면 이렇게 처리해야지!
        xhttp.onload = function(){
            console.log("============");
            const response_json = JSON.parse(xhttp.responseText); // 응답이 오면 responseText가 받는다.
            console.log(response_json);
            const items = response_json.gyeongnamculturallist.body.items.item;
            const demo = document.querySelector("#demo");
            
            for(const item of items){
                demo.innerHTML += `
                <tr>
                <td><a href='ajax_detail.html?no=${item["DOJIJUNG_NO"]}&name=${item["MYONGCHING"]}&content=${item["CONTENT"]}&img=${item['fileurl1']}'><img src="${item['fileurl1']}"alt="문화재사진"></a></td>
                <td>${item["DOJIJUNG_NO"]}</td>
                <td>${item["MYONGCHING"]}</td>
                </tr>`                
            }
        };

        // 보내라
        xhttp.send();
        console.log("end....")
    }
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .box{
            /* 요소 개수 상관 없이 전부 width가 같다. */
            flex: 1;
            height: 200px;
            background-color: skyblue;
        }

        /* 반응형 */
        /* 401px ~ 700px */
        @media screen and (min-width:401px) and (max-width:700px) {
            .container{
                flex-wrap: wrap;
            }

            .box{
                flex: 0 0 calc(50%-5px)
            }

            .box:nth-child(3){
                flex-basis: 100%;
            }
        }

        /* 400px 이하 */
        @media screen and (max-width:400px) {
            .container{
                flex-derection:column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">BOX</div>
        <div class="box">BOX</div>
        <div class="box">BOX</div>
    </div>
</body>
</html>

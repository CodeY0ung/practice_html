<!-- 태그 열고 닫고. 닫을 때 /붙이기 -->
<!-- 태그를 엘리먼트라고도 부름 -->
<!-- html 문서는 태그로 구성된다. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice html</title>

</head>

<body>
    <!-- 블록형 태그, 인라인 태그. 둘의 정의와 차이점 -->
    <!-- div == 구역을 나누는 것 -->
     <!-- div가 header, section등으로 바뀔 수 있음. 더 명확하게 의미를 부여, 의미를 부여하는 태그라고해서 symetic tag 라고 칭했다.-->

    <header>
        <!-- 블록 -->
        <h1>hello, html</h1>
        <h2>hello, html</h2>
    </header>


    <section>
        <!-- 문단 -->
        <p>abcdef</p> 
        <p>abcdef</p> 
    </section>

    <section>
        <!-- 인라인 -->
        <a>abcdef</a>
        <a href="p1.html">p1 page로 가기</a>
    </section>
    <hr>
    <div>
        <a href = "p1.html"><img src="images/짱구.webp" alt="짱구사진"></a>
    </div>

</body>
</html>

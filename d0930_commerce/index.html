<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            box-sizing: border-box;
            /* border: 1px solid white; */
        }

        body{
            margin: 0;
            text-align: center;
            background-color: white;
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;

            padding: 40px 0 60px;
        }

        /* 사이트 제목 */
        .title{
            color: black;
            font-size: 50px;
            font-weight: bold;
            font-style: italic;

            margin: 0 0 30px;
        }

        /* 배너 */
        .item-image{
            width: 1200px;
            height: 514px;

            overflow: hidden;
        }

        .slide-track{
            display: flex;
            animation: slide 20s infinite;
        }

        .slide-track img{
            width: 1200px;
            height: 514px;

            flex-shrink: 0;
            object-fit: cover;
        }

        /* 설명 */
        article{
            color: black;
            font-weight: bold;
            font-size: 24px;

            margin-top: 30px;
        }

        /* 버튼 */
        .button{
            width: 200px;
            height: 50px;

            border: 3px solid black;
            border-radius: 10px;

            margin-top: 20px;

            line-height: 44px;

            font-weight: bold;
            font-size: 25px;

            transition: 0.2s;
        }

        .button:hover{
            transform: scale(1.1);
        }

        .button > a{
            display: block;
            width: 100%;
            height: 100%;

            color: black;
            text-decoration: none;
        }

        .button > a:visited{
            color: black;
        }
        .slide-track > img{
            width: 1200px;
            height: 514px;

            flex-shrink: 0;

            object-fit: cover;
        }

        @keyframes slide{
            0%, 15%{
                transform: translateX(0);
            }

            20%, 35%{
                transform: translateX(-1200px);
            }

            40%, 55%{
                transform: translateX(-2400px);
            }

            60%, 75%{
                transform: translateX(-3600px);
            }

            80%, 95%{
                transform: translateX(-4800px);
            }

            100%{
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        
        <p class="title">dessertier<p>

        <div class="item-image">

            <div class="slide-track">
                <img src="img/banner/배너피넛.png" alt="허니 피넛 크런치 케이크">
                <img src="img/banner/배너넛.png" alt="몽블랑 체스트넛 티라미수">
                <img src="img/banner/배너초코.png" alt="딥 다크 초콜릿 가나슈 케이크">
                <img src="img/banner/배너피스타치오.png" alt="피스타치오 라즈베리 쁘띠 케이크">
                <img src="img/banner/배너치즈.png" alt="바스크 번트 치즈케이크">
            </div>

        </div>

        <article>
            당신의 가장 달콤한 순간을 위해.
        </article>

        <div class="button">
            <a href="menu.html">바로가기</a>
        </div>

    </div>

</body>
</html>

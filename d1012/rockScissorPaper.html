<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-around;
        }
        body{
            align-items: center;
            justify-items: center;
        }
        .box{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button{
            padding: 5px;
            background-color: gray;
            margin: 5px;
        }
        img{
            width: 200px;
            height: 200px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>COMPUTER</h2>
            <img src="img/white.png" alt="computer" id="com">
        </div>
        <h2 class="box">vs</h2>
        <div class="box">
            <h1>USER</h1>
            <img src="img/white.png" alt="user" id="user">
        </div>
    </div>
    <div><button id="start">시작</button></div>
    <div>
        <button id="scissor-btn">가위</button>
        <button id="rock-btn">바위</button>
        <button id="paper-btn">보</button>
    </div>
    <h1 id="result"></h1>
    <h1 id="record"></h1>
    <h1 id="score"></h1>
</body>
<script>
    let total = 0;
    let win = 0;
    let lose = 0;
    let score = 0;

    const comList = ["img/rock.png","img/scissor.png","img/paper.png"];
    const com = document.getElementById("com");
    const user = document.getElementById("user");
    const result = document.getElementById("result");
    const record = document.getElementById("record");
    const scoreDiv = document.getElementById("score");

    const playBtn = document.getElementById("start");
    playBtn.addEventListener("click",()=>{
        com.setAttribute("src","img/white.png");
        user.setAttribute("src","img/white.png");
        result.textContent = "";
    })

    function playGame(userChoice){
        let num = Math.floor(Math.random()*3)
        comChoice = comList[num];
        com.setAttribute("src",comChoice);
        user.setAttribute("src",userChoice);
        total++;

        if(comChoice === userChoice){
            result.textContent="무승부";
        }
        else if((
            comChoice === "img/scissor.png" && userChoice === "img/rock.png" ||
            comChoice === "img/rock.png" && userChoice === "img/paper.png" ||
            comChoice === "img/paper.png" && userChoice === "img/scissor.png"
        )){
            win++;
            result.textContent="승리";
            score+=100;
        }
        else{
            lose++;
            result.textContent="패배";
        }

        record.textContent = +total+"전 "+win+"승 "+lose+"패";
        scoreDiv.textContent = "점수 : "+score;
    }


    const scissorBtn = document.getElementById("scissor-btn");
    scissorBtn.addEventListener("click",()=>{
        playGame("img/scissor.png");
    })

    const rockBtn = document.getElementById("rock-btn");
    rockBtn.addEventListener("click",()=>{
        playGame("img/rock.png");
    })

    const paperBtn = document.getElementById("paper-btn");
    paperBtn.addEventListener("click",()=>{
        playGame("img/paper.png")
    })


    // 이런식으로도 할 수 있다. 이게 좀 더 효율적임.
    // target을 사용해서 이벤트 발생 경우의 수를 처리.
    // javascript 에는 event bubbling과 event capturing이라는게 있음.
    // bubbling : 자식 -> 부모, capturing : 부모 -> 자식
    // event가 전파가 된다는거임. 똑같은 이벤트일 경우에 전파되면서 전부 event 실행시킴.
    const btns = document.getElementById("div");
    btns.addEventListener("click",function(e){
        if(e.target.textContent === "scissor"){
            let user = 1;
            document.getElementById('user-img').src = "scissor.png";
        }else if(e.target.textContent === "rock"){
            let user = 2;
        }else if(e.target.textContent == "paper"){
            let user = 3;
        }else{

        }
    })
</script>
</html>

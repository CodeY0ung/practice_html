<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            background-color: black;
            
        }
        #big-circle{
            width: 300px;
            height: 300px;
            background-color: blue;
            
        }
        .middle-circle{
            width: 200px;
            height: 200px;
            background-color: red;
            
        }
        .small-circle{
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
        #big-circle, 
        .middle-circle, 
        .small-circle,
        .box{
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #big-circle, 
        .middle-circle, 
        .small-circle
        {
            border-radius: 50%;
            
        }
        body{
            text-align: center;
            justify-items: center;
        }
    </style>
</head>
<body>
    <h1>과녁을 만들어 봅시다.</h1>
    <div class="box">
        <div id="big-circle">
            <div class="middle-circle">
                <div class="small-circle">

                </div>
            </div>
        </div>
    </div>
</body>
<script>
    // 부모와 자식에 같은 click이벤트가 걸려있으면, 이벤트가 전파된다. bubbling이 기본
    // true를 붙이면 capturing이 설정됨. 
    const big = document.getElementsById("big-circle");
    const middle = document.getElementsByClassName("middle-circle");
    const small = document.getElementsByClassName("small-circle");
    big.addEventListner("click", ()=>{
        alert("big");
    }, true)
    middle.addEventListner("click",()=>{
        alert("middle");
    }, true)
    small.addEventListner("click",()=>{
        alert("small");
    }, true)

</script>
</html>

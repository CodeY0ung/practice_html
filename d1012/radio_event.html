<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name = frm>
        <input type="radio" name="job" value="developer" checked>
        개발자
        <input type="radio" name="job" value="desginer">
        디자이너
        <input type="radio" name="job" value="teacher">
        강사
        <button type="button" id="btn">확인</button>
    </form>
    <hr>
    <div id="result"></div>
</body>
<script>
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");
    
    btn.addEventListener("click",()=>{
        const jobs = document.frm.job;

        for(let i=0; i<jobs.length; i++){
            if(jobs[i].checked){
                result.textContent = `value : ${jobs[i].value},
                텍스트 : ${jobs[i].nextSibling.textContent}`;
            }
        }
    })





</script>
</html>

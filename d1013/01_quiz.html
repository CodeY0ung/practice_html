        }

<body>
    <form name="frm">
        <div id="demo">
        </div>
        <button type="button" id="btn">시작</button>
    </form>
</body>
<script>
    
    // 객체로 그냥 저장하자.
    let qList = [
        {
            q:`<p class="exam-question">다음 중 HTTP 상태 코드 404의 의미로 가장 적절한 것은?</p>
            <input type="radio" name="q" value="1">서버 내부 오류 <br>
            <input type="radio" name="q" value="2">요청한 리소스를 찾을 수 없음 <br>
            <input type="radio" name="q" value="3">인증되지 않은 사용자 <br>
            <input type="radio" name="q" value="4">요청 성공 <br>`,
            answer : "2",
            type : "radio"
        },
        {
            q:`<p class="exam-question">다음 중 관계형 데이터베이스에서 기본키(Primary Key)의 특징으로 옳은 것은?</p>
            <input type="radio" name="q" value="1">중복된 값을 가질 수 있다. <br>
            <input type="radio" name="q" value="2">반드시 문자열 자료형이어야 한다. <br>
            <input type="radio" name="q" value="3">각 행을 고유하게 식별한다. <br>
            <input type="radio" name="q" value="4">하나의 테이블에 여러 개의 기본키를 각각 독립적으로 지정할 수 있다. <br>`,
            answer : "3",
            type : "radio"
        },
        {
            q:`<p class="exam-question">다음 중 DML(Data Manipulation Language)에 해당하는 명령어를 모두 고르시오.</p>
            <input type="checkbox" name="q" value="1">SELECT <br>
            <input type="checkbox" name="q" value="2">INSERT <br>
            <input type="checkbox" name="q" value="3">UPDATE <br>
            <input type="checkbox" name="q" value="4">ALTER <br>`,
            answer : ["1","2","3"],
            type : "checkBox"
        },
        {
            q:`<p class="exam-question">다음 중 객체지향 프로그래밍의 특징에 해당하는 것을 모두 고르시오.</p>
            <input type="checkbox" name="q" value="1">캡슐화 <br>
            <input type="checkbox" name="q" value="2">상속 <br>
            <input type="checkbox" name="q" value="3">다형성 <br>
            <input type="checkbox" name="q" value="4">정규화 <br>`,
            answer : ["1","2","3"],
            type : "checkBox"
        },    
        {
            q:`<p class="exam-question">SQL에서 테이블의 구조를 변경할 때 사용하는 명령어를 작성하시오.</p>
            <input type="text" name="q">
            <span id="answer">alter</span>`,
            answer : "alter",
            type : "text"
        }
        
    ]
    
    // list를 랜덤 정렬
    qList.sort(() => Math.random() - 0.5);

    let page = 0;
    let index = 0;
    let answer = [];
    let userAnswer = [];
    let win = 0;
    let total = 0;

    const btn = document.getElementById("btn");
    btn.addEventListener("click",()=>{
        btn.textContent = "다음";

        // 현재 화면 답 저장.
        if(page>0){
            // radio일때
            if(qList[index].type==="radio"){
                userAnswer[index] = document.frm.q.value;
                answer[index] = qList[index].answer;
            }
            // checkbox일때
            else if(qList[index].type==="checkBox"){
                const users = [];
                const answers = document.frm.q;
                for(i=0;i<answers.length;i++){
                    if(answers[i].checked){
                        users.push(answers[i].value);
                    }
                }
                userAnswer[index] = users;
                answer[index] = qList[index].answer;
            }
            // text일때
            else if(qList[index].type==="text"){
                userAnswer[index] = document.frm.q.value;
                answer[index] = qList[index].answer;
            }
            index++;
        }
        
        page++;
        
        const demo = document.getElementById("demo");

        if(index<qList.length){
            demo.innerHTML = `${qList[index].q}`;
        }else{
            // 답 비교 넣으면 됨.
            for(let i=0; i<qList.length; i++){
                if(userAnswer[i]===answer[i]){
                    win++;
                }
                total++;
            }
            demo.innerHTML = `시험 종료. <br> total:${total}, win:${win}`
        }


        console.log(answer);
        console.log(userAnswer);
    })

    }
</script>
</html>

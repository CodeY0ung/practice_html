<script>
  // 1. 학생 데이터
  const students = [
    { id: 1, name: '김철수', age: 17, grade: 'A', score: 92, subjects: ['수학', '영어'] },
    { id: 2, name: '이영희', age: 16, grade: 'B', score: 78, subjects: ['과학', '영어'] },
    { id: 3, name: '박민수', age: 18, grade: 'A', score: 88, subjects: ['수학', '과학'] },
    { id: 4, name: '최지연', age: 17, grade: 'C', score: 65, subjects: ['영어', '미술'] },
    { id: 5, name: '정다운', age: 16, grade: 'B', score: 81, subjects: ['수학', '체육'] },
    { id: 6, name: '한소희', age: 18, grade: 'A', score: 95, subjects: ['과학', '수학'] },
    { id: 7, name: '오세훈', age: 17, grade: 'D', score: 52, subjects: ['미술', '체육'] },
    { id: 8, name: '윤아름', age: 16, grade: 'B', score: 76, subjects: ['영어', '과학'] },
  ];

  // 2. 상품 데이터
  const products = [
    { id: 101, name: '노트북', category: '전자기기', price: 1500000, stock: 5, rating: 4.5 },
    { id: 102, name: '마우스', category: '전자기기', price: 35000, stock: 50, rating: 4.2 },
    { id: 103, name: '책상', category: '가구', price: 250000, stock: 12, rating: 4.8 },
    { id: 104, name: '의자', category: '가구', price: 180000, stock: 8, rating: 4.0 },
    { id: 105, name: '키보드', category: '전자기기', price: 120000, stock: 0, rating: 4.6 },
    { id: 106, name: '스탠드', category: '가구', price: 45000, stock: 30, rating: 3.9 },
    { id: 107, name: '모니터', category: '전자기기', price: 400000, stock: 15, rating: 4.7 },
    { id: 108, name: '책장', category: '가구', price: 320000, stock: 3, rating: 4.3 },
  ];

  // 3. 주문 데이터
  const orders = [
    { orderId: 1, userId: 'user1', items: [{ name: '노트북', qty: 1, price: 1500000 }], status: '배송완료' },
    { orderId: 2, userId: 'user2', items: [{ name: '마우스', qty: 2, price: 35000 }, { name: '키보드', qty: 1, price: 120000 }], status: '배송중' },
    { orderId: 3, userId: 'user1', items: [{ name: '의자', qty: 1, price: 180000 }], status: '배송완료' },
    { orderId: 4, userId: 'user3', items: [{ name: '책상', qty: 1, price: 250000 }, { name: '스탠드', qty: 2, price: 45000 }], status: '주문접수' },
    { orderId: 5, userId: 'user2', items: [{ name: '모니터', qty: 1, price: 400000 }], status: '배송완료' },
  ];

  // 4. 숫자 배열
  const numbers = [3, 7, 1, 9, 4, 12, 8, 5, 15, 2, 6, 11];

  // filter
  // 1. 성적이 80점 이상인 학생만 추출하기
  const stOver80 = students.filter((student)=>student.score>=80)
  console.log(stOver80);
  // 2. 수학을 듣는 학생만 추출하기
  const stMath = students.filter(students=>students.subjects.includes("수학"))
  console.log(stMath);
  // 3. 제고가 있는 상품만 추출하기
  const prdNotEmpty = products.filter((product)=>product.stock>0)
  console.log(prdNotEmpty);
  // 4. 전자기기 && 가격이 20만원 이하인 제품들만 추출하기
  const prdElec = products.filter((product)=>product.category==='전자기기' && product.price<=200000)
  console.log(prdElec);
  // 5. 숫자 짝수만 추출하기
  const even = numbers.filter(num=>num%2===0)
  console.log(even);


  // map
  // 1. 학생 이름만
  const names = students.map(student=>student.name)
  console.log(names);
  // 2. 숫자 배열의 각 요소를 제곱한 배열
  const multi = numbers.map(num=>num*num);
  console.log(multi);
  // 3. 모든 상품 가격에 부가세(10%) 포함 가격 배열 만들기
  const price10per = products.map(prd=>{
    return {
      name : prd.name,
      totalPrice : prd.price*1.1
    }
  });
  console.log(price10per);
  // 4. 주문별 총 금액 계산해서 배열 만들기
  const totalByOrder = orders.map(order=>{
    return {
      orderId : order.orderId,
      totalPrice : order.items[0].qty * order.items[0].price
    }
  });
  console.log(totalByOrder);

  // reduce
  // 1. 숫자 배열 합계
  const sumReduce = numbers.reduce((acc,num)=>{
    return acc+num
  },0)
  console.log(sumReduce);
  // 2. 상품의 총 재고 가치(price*stock 합)
  const priceStockReduce = products.reduce((acc,product)=>{
    return acc+product.price*product.stock;
  },0)
  console.log(priceStockReduce);
  // 3. 카테고리별 상품 개수 세기
  const stockByCategory = products.reduce((acc,product)=>{
    acc[product.category] = (acc[product.category] || 0) + 1
    return acc;
  },{})
  // 4. 학생들의 평균 점수
  const avgScore = students.reduce((acc,student)=>{
    return (acc+student.score)/studens.length;
  })
  // 5. 최고 점수 학생 찾기
  const highest = students.reduce((acc,student)=>{
    if(student.score>acc){
      acc = student.score
    }
    return acc;
  },0)
  
  // 종합
  // 1. A등급 학생들의 평균 점수
  
  // 2. 재고 있는 전자기기ㅡ이 평균 평점
  // 3. 17세 이상 학생들의 이름 목록

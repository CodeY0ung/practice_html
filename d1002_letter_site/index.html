<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/index_css.css">
</head>
<body>

    <section class="intro-section first">
        <h1>
            오늘 나눈 대화가<br>
            그 사람과의 마지막이라면?
        </h1>

        <p>마지막으로 남긴 말이 지금 그 말이어도 괜찮을까요?</p>

        <div class="scroll">↓</div>
    </section>


    <section class="intro-section conversation">
        <div class="chat-box">
            <p class="other">오늘 저녁 먹고 들어와?</p>
            <p class="me">몰라. 바빠.</p>
        </div>

        <h2>
            우리는 마지막 대화가<br>
            언제인지 알 수 없습니다.
        </h2>
    </section>


    <section class="intro-section person">
        <h2>지금 떠오르는 사람이 있나요?</h2>

        <div class="people">
            <span>엄마</span>
            <span>아빠</span>
            <span>친구</span>
            <span>연인</span>
            <span>고마운 사람</span>
        </div>

        <p>그 사람에게 아직 하지 못한 말은 무엇인가요?</p>
    </section>


    <section class="intro-section ending">
        <h2>아직 전하지 못한 마음</h2>

        <div class="words">
            <div class="love">사랑해</div>
            <div class="sorry">미안해</div>
            <div class="thanks">고마워</div>
        </div>

        <a href="card.html" class="start-btn">
            마음을 전하러 가기
        </a>
    </section>

</body>
</html>

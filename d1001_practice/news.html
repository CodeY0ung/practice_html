<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="img/fruits4.jpg">
    <style>
        *{
            /* border: 1px solid black; */
        }
        body{
            margin: 0px;
            padding: 0px;
        }
        .page-header{
            display: flex;
            justify-content: space-between;
        }
        h1{
            margin-top: 0px;
        }
        .logo{
            width : 110px;
        }
        nav > ul{
            margin-top: 10px;
        }
        .top-menu{
            display: flex;
            justify-content: space-between;
            
            width: 200px;
        }
        .top-menu li{
            list-style-type: none;
        }
        .wrapper{
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 4%;
        }

        .home-content{
            text-align: center;
            margin-top: 10%;
        }
        .home-content p{
            font-size: 1.125rem;
            margin: 10px 0 42px;
        }
        .page-title{
            font-size: 5rem;
            font-family: 'Phiosopher', serif;
            text-transform: uppercase;
            font-weight: normal;
        }
        .button{
            font-size: 1.375;
            background-color: #0bd;
            color: #fff;
            border-radius: 5px;
            padding: 18px 32px;
        }
        .button:hover{
            background-color: #0090aa;
        }
        a{
            text-decoration: none;
        }
        #news{
            background-image: url(img/fruits4.jpg);
            height: 270px;
            margin-bottom: 40px;
        }
        #news .page-title{
            text-align: center;
        }
        footer{
            background-color: #432;
            text-align: center;
            padding: 26px 0;
        }
        footer p{
            columns: #fff;
            font-size: 0.875rem;
        }
        .news-contents{
            display: flex;
            justify-content: space-between;
            margin-bottom: 50px;
        }
        article{
            width: 74%;
        }
        aside{
            width: 22%;
        }
        .post-info{
            position: relative;
            padding-top: 4px;
            margin-bottom: 40px;
        }
        .post-date{
        
        }
    </style>
</head>
<body>
    <div id="news" class="big-big">
        <header class="wrapper">
            <h2 class="page-title">News</h2>
        </header>
    </div>
    <div class="news-contents wrapper">
        <article>
            <h2 class="post-title">가게 내부의 갤러리 그림들을 교체했습니다.</h2>
            <p class="post-date">3/30 <span>2019</span></p>
            <p class="post-cat">카테고리: 가게 소개</p>
        </article>
        
        <aside>
            사이드바 부분
        </aside>
    </div>
    <footer>
        <div class="wrapper">
            <p><small>&copy; 2019WBCafe</small></p>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
</head>
<body>
    <header>
        sign up
    </header>

    <section>
        <hr>
        <form>
            <br>이름을 입력하세요<br>
            <input type="text" name="name" placeholder="ex)홍길동" required>
            <br>생년월일을 입력하세요<br>
            <input type="text" name="birth" placeholder="ex)000611" required>
            <br>email을 입력하세요<br>
            <input type="text" name="email" placeholder="ex)aaaaa@hmail.com" required>
            <br>ID를 입력하세요<br>
            <input type="text" name="id" placeholder="ex)aaaaaaaaaa" required>
            <br>PASSWORD를 입력하세요<br>
            <input type="password" name="pw" required minlength="8">
            <br>성별을 선택하세요<br>
            <input type="radio" name="gender" value="male">남
            <input type="radio" name="gender" value="female">여
            <br>약관에 동의하시겠습니까<br>
            <input type="radio" name="agreement" value="yes">동의
            <input type="radio" name="agreement" value="no" checked>동의하지 않음
            <br>
            <input type="submit" value="제출하기"> 

        </form>
    </section>
    
</body>
</html>

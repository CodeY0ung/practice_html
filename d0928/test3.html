<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 연습</title>
    <style>
        p{
            color: red;
        }
        /* 직계자식이 아니라도 안에 있는 모든 자식들 */
        #outer p{
            background-color: skyblue;
        }
        /* 직계 자식만 */
        #outer > p{
            font-size: 2rem;
        }
        /* list 순서에따라서 적용도 가능. 홀수짝수도 2n+1,2n같은 식으로 표현 가능. 4번째 부터 끝까지 = n+4*/
        li:nth-child(1){
            color: blue;
        }
        li:last-child{
            background-color: yellowgreen;
        }
        li:first-child{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div id="outer">
        <h1>선택자 연습</h1>
        <p>aaaaaaaaaaaa</p>
        <p>bbbbbbbbbbbb</p>
        <div id="inner">
            <p>cccccccccccccc</p>
        </div>
    </div>
    <p>ddddddddddddd</p>
    <hr>
    <ul>
        <li>1111111111</li>
        <li>2222222222</li>
        <li>3333333333</li>
        <li>4444444444</li>
        <li>5555555555</li>

    </ul>
</body>
</html>

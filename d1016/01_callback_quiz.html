<script>
    const nums = [1,2,3,4];

    // callback 함수를 조건으로 둔 이유는 두개의 함수를 밀접하게 묶어버리겠다는 의지가 표명된다.
    function f1(nums,callback){
        const sum = nums.reduce((acc,n)=>{
            return acc+n;
        },0);
        callback(sum);
    }

    function callback(num){
        console.log(num)
    }

    f1(nums,callback);
</script>
</html>

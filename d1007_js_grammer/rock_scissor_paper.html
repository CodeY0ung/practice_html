<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="user-input" placeholder="가위, 바위, 보">
    <button onclick="play()">게임하기</button>

    <script>
        // 1 ~ 3 정수

        

        let cnt = 0;
        let win = 0;
        let com;

        function play(){        

            cnt++;
            // html의 입력 값과 연동
            let me = document.getElementById("user-input").value;
    
            com = randomCom();

            rsp(me, com);
        }
        
        const validate = (me) => (me!=="가위" && me!=="바위" && me!=="보");

        function randomCom(){
            let num = Math.floor(Math.random()*3)+1
            let com;
    
            switch(num){
                case 1:
                    com = "가위";
                    break;
                case 2:
                    com = "바위";
    
                    break;
                case 3:
                    com = "보";
                    break;
            }
            return com;
        }

        function rsp(me, com){
            console.log("me : "+me+", com : "+com);

            if(validate(me)){
                console.log("잘못된 값입니다.");
                return;
            }

            if(me===com){
                console.log("비겼습니다.");
            }
            else if((me==="가위" && com==="보")||me==="바위" && com==="가위"||me==="보" && com==="바위"){
                console.log("이겼습니다.");
                win++;
            }
            else{
                console.log("졌습니다.")
            }
            
    
            console.log(cnt + "전 "+win+"승")
            console.log("--------------")
        }
        
        
    </script>
</body>
</html>
